# Peaker website — nginx config
# Copy to /etc/nginx/sites-available/peaker and link into sites-enabled.
# Replace yourdomain.com everywhere, then run certbot (see DEPLOY.md).

limit_req_zone $binary_remote_addr zone=peaker_leads:10m rate=6r/m;

# The bare domain always goes to www
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;
    return 301 https://www.yourdomain.com$request_uri;
}

server {
    # certbot adds "listen 443 ssl", the certificate lines and the HTTP->HTTPS redirect to this block.
    listen 80;
    listen [::]:80;
    server_name www.yourdomain.com;
    root /var/www/peaker;
    index index.html;
    charset utf-8;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
    gzip_min_length 512;

    # Pages
    # Note: no add_header inside locations, or nginx drops the security headers above.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    error_page 404 /404.html;
    location ^~ /ar/ {
        error_page 404 /ar/404.html;
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Portfolio demo pages: self-contained pages that use inline code and Google Fonts.
    # (Headers are restated here because nginx drops server-level headers when a location adds its own.)
    location ^~ /work/demos/ {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static files: CSS and JS carry a version in their URL, so they can be cached for a year
    location /assets/ {
        expires 365d;
        access_log off;
    }

    # Contact form -> lead endpoint -> Odoo CRM
    location = /api/lead {
        limit_req zone=peaker_leads burst=3 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 20k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location /api/ { return 404; }
}
